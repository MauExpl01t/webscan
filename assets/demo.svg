<svg viewBox="0 0 965.5999999999999 421" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="965.5999999999999" height="421" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="0" width="965.5999999999999" height="30" rx="10" fill="#161b22"/>
  <rect x="0" y="20" width="965.5999999999999" height="10" fill="#161b22"/>
  <circle cx="20" cy="15" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="15" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="15" r="6" fill="#27c93f"/>
  <text x="482.79999999999995" y="19" text-anchor="middle" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="12" fill="#8b949e">mauricio@maluenda: ~/webscan</text>
  <text x="20" y="56" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#27c93f" xml:space="preserve">$ webscan scan https://example.com --i-have-authorization</text>
<text x="20" y="75" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#58a6ff" xml:space="preserve">Objetivo : https://example.com</text>
<text x="20" y="94" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#58a6ff" xml:space="preserve">Puntaje  : 68/100</text>
<text x="20" y="113" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#58a6ff" xml:space="preserve">Resumen  : MEDIUM=4, LOW=2, INFO=3</text>
<text x="20" y="132" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve"></text>
<text x="20" y="151" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#ffbd2e" xml:space="preserve">[MEDIA] Sin protección contra clickjacking  (headers.clickjacking)</text>
<text x="20" y="170" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">    La página puede incrustarse en un iframe de otro sitio, habilitando ataques de clickjacking.</text>
<text x="20" y="189" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#8b949e" xml:space="preserve">    Solución : Usa Content-Security-Policy: frame-ancestors 'self' (o X-Frame-Options: DENY/SAMEORIGIN).</text>
<text x="20" y="208" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve"></text>
<text x="20" y="227" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#ffbd2e" xml:space="preserve">[MEDIA] Falta Content-Security-Policy (CSP)  (headers.csp)</text>
<text x="20" y="246" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">    CSP reduce el impacto de XSS e inyecciones de contenido restringiendo los orígenes permitidos.</text>
<text x="20" y="265" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#8b949e" xml:space="preserve">    Solución : Define una CSP restrictiva, p. ej. default-src 'self'; object-src 'none'; frame-ancestors</text>
<text x="20" y="284" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">    'self'.</text>
<text x="20" y="303" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve"></text>
<text x="20" y="322" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#ffbd2e" xml:space="preserve">[MEDIA] Falta Strict-Transport-Security (HSTS)  (headers.hsts)</text>
<text x="20" y="341" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">    Sin HSTS, un atacante en la red puede forzar o interceptar conexiones HTTP (SSL stripping).</text>
<text x="20" y="360" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#8b949e" xml:space="preserve">    Solución : Agrega: Strict-Transport-Security: max-age=31536000; includeSubDomains</text>
<text x="20" y="379" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve"></text>
<text x="20" y="398" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#8b949e" xml:space="preserve">... y 5 hallazgos más (ver salida completa con --format html)</text>

</svg>